<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reproductor M3U</title>
<style>
:root{--bg:#e6edf2;--panel:#f7fafc;--ink:#18283a;--mute:#5d7084;--line:#c3d0db;--acc:#2447ff;--accink:#fff;--tape:#f3c640;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101c27;--panel:#182a38;--ink:#e8eff6;--mute:#93a6b9;--line:#2c4154;--acc:#f3c640;--accink:#18283a;--danger:#ff8a80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:6px 0 10px}
button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],input[type=url],input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px}
summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details>div{padding-bottom:14px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.now{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
#ttl{font-size:1.2rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
#art{color:var(--mute);min-height:1.4em;overflow-wrap:anywhere}
#seek{width:100%;margin:12px 0 0;accent-color:var(--acc);height:28px}
.times{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.ctl .big{width:64px;height:64px;border-radius:50%;background:var(--acc);border-color:var(--acc);color:var(--accink);padding:0;display:grid;place-items:center}
.ctl .sm{min-width:48px;padding:0 8px;display:grid;place-items:center}
.opt{display:flex;gap:8px;margin-top:10px}
.opt button{flex:1;font-size:.9rem}
.opt button[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:#18283a}
#status{min-height:1.4em;color:var(--mute);font-size:.9rem;margin:6px 2px 8px}
#status.err{color:var(--danger)}
ol{list-style:none;margin:8px 0 0;padding:0}
li button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;min-height:52px;padding:8px 6px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:400}
li:first-child button{border-top:0}
li .t{overflow-wrap:anywhere}
li .t b{font-weight:600;display:block}
li .t span{color:var(--mute);font-size:.85rem}
li .d{color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums;flex:none}
li.on button{background:var(--panel);box-shadow:inset 4px 0 0 var(--acc)}
li.bad .t{opacity:.5}
.empty{color:var(--mute);padding:14px 4px}
@media (prefers-reduced-motion:no-preference){button:active{transform:scale(.97)}}
</style>
</head>
<body>
<main>
<h1>Reproductor M3U</h1>

<details id="src">
<summary>Cargar lista</summary>
<div>
<div><label for="url" style="color:var(--mute);font-size:.85rem">Enlace a la lista .m3u (se actualiza cada vez que abrís)</label>
<input id="url" type="url" inputmode="url" placeholder="https://…/mi-lista.m3u" autocomplete="off"></div>
<div class="row"><button id="loadUrl">Cargar enlace</button>
<button id="loadFile">Abrir archivo</button>
<input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl" hidden></div>
<div><label for="paste" style="color:var(--mute);font-size:.85rem">O pegá el contenido de la lista</label>
<textarea id="paste" placeholder="#EXTM3U&#10;#EXTINF:-1,Artista - Título&#10;https://…/cancion.mp3"></textarea></div>
<div class="row"><button id="usePaste">Usar texto pegado</button></div>
<a href="generador.html" style="color:var(--acc);font-weight:600;min-height:44px;display:flex;align-items:center">Crear o editar listas</a>
</div>
</details>

<section class="now" aria-label="Reproduciendo">
<div id="ttl">Sin canción</div>
<div id="art"></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición">
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl">
<button id="prev" class="sm" aria-label="Anterior"></button>
<button id="back" class="sm" aria-label="Retroceder 10 segundos">−10</button>
<button id="play" class="big" aria-label="Reproducir"></button>
<button id="fwd" class="sm" aria-label="Adelantar 10 segundos">+10</button>
<button id="next" class="sm" aria-label="Siguiente"></button>
</div>
<div class="opt">
<button id="shuf" aria-pressed="false">Aleatorio</button>
<button id="rep">Repetir: no</button>
</div>
</section>

<div id="status" role="status" aria-live="polite"></div>
<input id="q" type="search" placeholder="Buscar en la lista" aria-label="Buscar en la lista">
<ol id="list"></ol>
<audio id="au" preload="metadata"></audio>
</main>

<script>
const $=s=>document.querySelector(s);
const au=$('#au');
const IC={
  play:'<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>',
  next:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>'
};
$('#prev').innerHTML=IC.prev;$('#next').innerHTML=IC.next;$('#play').innerHTML=IC.play;

let tracks=[],cur=-1,shuffle=false,rep=0,hist=[],errStreak=0,base='',listName='',dragging=false;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function status(m,err){const s=$('#status');s.textContent=m||'';s.className=err?'err':''}
function fmt(s){if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function dec(s){try{return decodeURIComponent(s)}catch(e){return s}}

function parse(text,baseUrl){
  const out=[];let info=null,name='';
  for(const raw of text.replace(/^\ufeff/,'').split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#PLAYLIST:')){name=l.slice(10).trim();continue}
    if(l.startsWith('#EXTINF:')){
      const m=l.slice(8).match(/^(-?\d+(?:\.\d+)?)[^,]*,(.*)$/);
      if(m){const sp=m[2].match(/^(.+?)\s+-\s+(.+)$/);
        info={dur:+m[1],artist:sp?sp[1].trim():'',title:(sp?sp[2]:m[2]).trim()}}
      continue;
    }
    if(l.startsWith('#'))continue;
    let url=l,bad=false;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(l)){
      if(/^[a-z]:[\\/]/i.test(l)||l.includes('\\')||!baseUrl)bad=true;
      else{try{url=new URL(l,baseUrl).href}catch(e){bad=true}}
    }
    const file=dec(l.split(/[\\/]/).pop().split('?')[0]).replace(/\.[^.]+$/,'').replace(/_/g,' ');
    const t=info||{dur:-1,artist:'',title:''};
    out.push({title:t.title||file||'Sin título',artist:t.artist,dur:t.dur,url,bad});
    info=null;
  }
  return{tracks:out,name};
}

function render(){
  const ol=$('#list');ol.innerHTML='';
  if(!tracks.length){const li=document.createElement('li');li.className='empty';li.textContent='No hay lista cargada. Abrí "Cargar lista" para empezar.';ol.append(li);return}
  tracks.forEach((t,i)=>{
    const li=document.createElement('li');li.dataset.i=i;
    if(t.bad)li.className='bad';
    const b=document.createElement('button');
    const tx=document.createElement('div');tx.className='t';
    const n=document.createElement('b');n.textContent=t.title;tx.append(n);
    if(t.artist){const a=document.createElement('span');a.textContent=t.artist;tx.append(a)}
    const d=document.createElement('div');d.className='d';d.textContent=t.dur>0?fmt(t.dur):'';
    b.append(tx,d);b.onclick=()=>{hist=[];play(i)};
    li.append(b);ol.append(li);
  });
  mark();filter();
}
function mark(){
  document.querySelectorAll('#list li').forEach(li=>li.classList.toggle('on',+li.dataset.i===cur));
  const el=document.querySelector('#list li.on');if(el)el.scrollIntoView({block:'nearest'});
}
function filter(){
  const q=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('#list li[data-i]').forEach(li=>{
    const t=tracks[+li.dataset.i];
    li.hidden=!!q&&!(t.title+' '+t.artist).toLowerCase().includes(q);
  });
}
$('#q').addEventListener('input',filter);

function setMeta(t){
  $('#ttl').textContent=t?t.title:'Sin canción';
  $('#art').textContent=t?(t.artist||''):'';
  document.title=t?t.title+' · Reproductor M3U':'Reproductor M3U';
  if('mediaSession' in navigator&&t){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:listName||'Lista M3U'})}catch(e){}
  }
}
function fail(msg){
  const t=tracks[cur];
  errStreak++;
  if(errStreak>=Math.min(tracks.length,5)){
    status(msg+' Revisá que los enlaces sean públicos y directos a un archivo de audio.',true);return;
  }
  status(msg+' Paso a la siguiente.',true);
  setTimeout(()=>go('next',true),1200);
}
function play(i){
  if(i<0||i>=tracks.length)return;
  cur=i;const t=tracks[i];setMeta(t);mark();
  $('#seek').value=0;$('#cur').textContent='0:00';$('#dur').textContent=t.dur>0?fmt(t.dur):'0:00';
  if(t.bad){fail('La ruta de «'+t.title+'» no es un enlace web.');return}
  status('Cargando…');
  au.src=t.url;
  const p=au.play();
  if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError')status('Tocá play para empezar.');});
}
function go(dir,auto){
  if(!tracks.length)return;
  if(dir==='prev'){
    if(au.currentTime>3){au.currentTime=0;return}
    if(hist.length){play(hist.pop());return}
    play(cur>0?cur-1:tracks.length-1);return;
  }
  let n;
  if(shuffle&&tracks.length>1){do{n=Math.floor(Math.random()*tracks.length)}while(n===cur)}
  else{n=cur+1;if(n>=tracks.length){if(auto&&rep!==1){status('Fin de la lista.');return}n=0}}
  if(cur>=0){hist.push(cur);if(hist.length>50)hist.shift()}
  play(n);
}
$('#next').onclick=()=>{errStreak=0;go('next')};
$('#prev').onclick=()=>go('prev');
$('#play').onclick=()=>{
  if(cur<0){if(tracks.length)go('next');return}
  au.paused?au.play():au.pause();
};
$('#back').onclick=()=>{au.currentTime=Math.max(0,au.currentTime-10)};
$('#fwd').onclick=()=>{if(isFinite(au.duration))au.currentTime=Math.min(au.duration,au.currentTime+10)};
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);store.set('m3u_shuf',shuffle?'1':'0')};
const REP=['Repetir: no','Repetir: todas','Repetir: una'];
$('#rep').onclick=e=>{rep=(rep+1)%3;e.currentTarget.textContent=REP[rep];store.set('m3u_rep',String(rep))};

au.addEventListener('play',()=>{$('#play').innerHTML=IC.pause;$('#play').setAttribute('aria-label','Pausar')});
au.addEventListener('pause',()=>{$('#play').innerHTML=IC.play;$('#play').setAttribute('aria-label','Reproducir')});
au.addEventListener('playing',()=>{errStreak=0;status('')});
au.addEventListener('waiting',()=>status('Cargando…'));
au.addEventListener('loadedmetadata',()=>{$('#dur').textContent=fmt(au.duration)});
au.addEventListener('ended',()=>{
  if(rep===2){au.currentTime=0;au.play();return}
  go('next',true);
});
au.addEventListener('error',()=>{
  if(cur<0||!au.getAttribute('src'))return;
  fail('No se pudo reproducir «'+tracks[cur].title+'».');
});
let lastPos=0;
au.addEventListener('timeupdate',()=>{
  if(!dragging&&isFinite(au.duration)&&au.duration>0)$('#seek').value=Math.round(au.currentTime/au.duration*1000);
  if(!dragging)$('#cur').textContent=fmt(au.currentTime);
  const now=Date.now();
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&isFinite(au.duration)&&now-lastPos>2000){
    lastPos=now;
    try{navigator.mediaSession.setPositionState({duration:au.duration,playbackRate:au.playbackRate||1,position:Math.min(au.currentTime,au.duration)})}catch(e){}
  }
});
const seek=$('#seek');
seek.addEventListener('input',()=>{dragging=true;if(isFinite(au.duration))$('#cur').textContent=fmt(seek.value/1000*au.duration)});
seek.addEventListener('change',()=>{if(isFinite(au.duration))au.currentTime=seek.value/1000*au.duration;dragging=false});

if('mediaSession' in navigator){
  const ms=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  ms('play',()=>au.play());ms('pause',()=>au.pause());
  ms('previoustrack',()=>go('prev'));ms('nexttrack',()=>{errStreak=0;go('next')});
  ms('seekbackward',()=>{au.currentTime=Math.max(0,au.currentTime-10)});
  ms('seekforward',()=>{if(isFinite(au.duration))au.currentTime=Math.min(au.duration,au.currentTime+10)});
  ms('seekto',d=>{if(d&&isFinite(d.seekTime))au.currentTime=d.seekTime});
}

function setList(text,baseUrl,msg){
  const r=parse(text,baseUrl);
  if(!r.tracks.length){status('No encontré canciones en esa lista.',true);return false}
  tracks=r.tracks;listName=r.name;base=baseUrl;cur=-1;hist=[];errStreak=0;
  au.pause();au.removeAttribute('src');au.load();setMeta(null);
  render();
  status(msg||tracks.length+' canciones cargadas.');
  return true;
}
async function loadUrl(u,silent){
  u=u.trim();if(!/^https?:\/\//i.test(u)){status('Poné un enlace que empiece con http:// o https://',true);return}
  if(!silent)status('Cargando lista…');
  try{
    const res=await fetch(u,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(setList(text,u)){
      store.set('m3u_url',u);store.set('m3u_text',text);
      $('#src').open=false;
    }
  }catch(e){
    if(silent&&tracks.length){status('Sin conexión con el enlace: uso la última lista guardada.');return}
    status('No pude leer el enlace. Si la lista está en B2 o R2, hay que activar CORS en el bucket. Mientras tanto podés abrir el archivo o pegar el texto.',true);
  }
}
$('#loadUrl').onclick=()=>loadUrl($('#url').value);
$('#loadFile').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const text=await f.text();
  if(setList(text,'',f.name+': '+(parse(text,'').tracks.length)+' canciones.')){
    store.set('m3u_text',text);store.del('m3u_url');$('#src').open=false;
  }
  e.target.value='';
};
$('#usePaste').onclick=()=>{
  const text=$('#paste').value;
  if(setList(text,'')){store.set('m3u_text',text);store.del('m3u_url');$('#paste').value='';$('#src').open=false}
};

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

(function init(){
  shuffle=store.get('m3u_shuf')==='1';$('#shuf').setAttribute('aria-pressed',shuffle);
  rep=+store.get('m3u_rep')||0;$('#rep').textContent=REP[rep];
  const u=store.get('m3u_url'),t=store.get('m3u_text');
  if(u)$('#url').value=u;
  if(t){setList(t,u||'','');status(tracks.length+' canciones.')}
  else{render();$('#src').open=true}
  if(u)loadUrl(u,true);
})();
</script>
</body>
</html>
